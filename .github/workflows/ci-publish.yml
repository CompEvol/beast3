name: CI & Publish

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

# A new push to a pull request cancels the run it replaces, so superseded runs
# leave no artifacts behind. Pushes to master and tags are never cancelled, so a
# deploy or release is not cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every mvn call: batch mode, no download progress in the log, and more patient
# retries when Maven Central answers 429 Too Many Requests or 503 (the resolver
# already retries these 3 times by default; a full download after a pom change
# can need more).
env:
  MAVEN_ARGS: >-
    -B -ntp
    -Daether.connector.http.retryHandler.count=8
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.serviceUnavailable=429,503

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Instead of setup-java's `cache: maven`, which only restores a cache whose key
      # (a hash of every pom.xml) matches exactly: after any pom change, even a
      # comment, it started from an empty ~/.m2 and downloaded everything again.
      # restore-keys falls back to the newest older cache, so only what is new is
      # downloaded.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up JDK 25 (Azul Zulu) for GitHub Packages
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up JDK 25 (Azul Zulu) for Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Publishing version: $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Build and test
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: mvn verify

      - name: Deploy all modules to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -Prelease clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Only needed to debug a failed run, so keep it for a week only
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maven-test-results
          retention-days: 7
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml