# Every beast-fx test runs with DialogWatchdog (registered in
# META-INF/services/org.junit.jupiter.api.extension.Extension): a modal dialog that nobody
# answers fails the test instead of hanging the run (#302).
junit.jupiter.extensions.autodetection.enabled=true
# A backstop for any other hang: no beast-fx test should take this long.
junit.jupiter.execution.timeout.default=15 m
